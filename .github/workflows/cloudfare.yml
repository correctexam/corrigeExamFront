name: Angular GitHub CI
on:
  push:
    branches:
      - main
      - cloudfaredeploy

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:

      - uses: actions/checkout@v2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache node modules
        id: cache-nodemodules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          # caching node_modules
          path: node_modules
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: Install all system dependencies
        run: sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - name: Install Dependencies
        if: steps.cache-nodemodules.outputs.cache-hit != 'true'
        run: |
          npm ci --legacy-peer-deps
      - name: Build
        run: |
          npm run webapp:build:prodcloudfare
      - name: Lint
        run: |
          npm run lint
      - name: Test
        run: |
          npm run test
      - name: Copy 404
        run: |
          npm run copy:404
      - name: Typst compiler from a CDN (Cloudflare Pages serves files up to 25 MiB, the compiler is 27 MiB)
        run: |
          STATIC=target/classes/static
          WASM="$STATIC/content/typst/wasm/typst_ts_web_compiler_bg.wasm"
          # same package and version as the build: the JavaScript glue of the compiler must match its Wasm
          VERSION=$(node -p "require('./node_modules/@myriaddreamin/typst-ts-web-compiler/package.json').version")
          URL="https://cdn.jsdelivr.net/npm/@myriaddreamin/typst-ts-web-compiler@${VERSION}/pkg/typst_ts_web_compiler_bg.wasm"
          curl -sSfL --retry 3 "$URL" -o /tmp/typst_ts_web_compiler_bg.wasm
          cmp /tmp/typst_ts_web_compiler_bg.wasm "$WASM"
          rm "$WASM"
          echo "{\"wasm\": \"$URL\"}" > "$STATIC/content/typst/compiler.json"
          cat "$STATIC/content/typst/compiler.json"
          # the service worker checks the hashes of the assets: manifest made again (wasm removed, compiler.json changed)
          npx ngsw-config "$STATIC" ngsw-config.json /
          # nothing left above the limit of Cloudflare Pages
          if find "$STATIC" -type f -size +25M | grep .; then echo "files above 25 MiB" && exit 1; fi
      - name: prepare header fire sharearraybuffer support
        run: |
          echo "/*" > ./target/classes/static/_headers
          echo "  Cross-Origin-Opener-Policy: same-origin" >> ./target/classes/static/_headers
          echo "  Cross-Origin-Embedder-Policy: require-corp" >> ./target/classes/static/_headers
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/classes/static
          publish_branch: cloudfare
      - name: DeployCloudfaredeploy
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.ref == 'refs/heads/cloudfaredeploy' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/classes/static
          publish_branch: cloudfare


