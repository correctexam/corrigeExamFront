<div class="flex-container">
  <jhi-summary-template
    (gotoQ)="goToQuestion($event)"
    (deleteQ)="deleteQuestion($event)"
    class="summary"
    [questions]="eventHandler.questions"
  ></jhi-summary-template>
  <p-blockUI [blocked]="blocked">
    <!--<i class="pi pi-lock" style="font-size: 3rem"></i>-->
    <p-progressSpinner></p-progressSpinner>
  </p-blockUI>

  @if (processpdf) {
    <div class="canvas-wrapper foo">
      @if (metadataProblems().length > 0) {
        <div class="alert alert-warning metadata-problems" role="alert" data-cy="template-metadata-problems">
          {{ 'scanexam.templatemetadatainvalid' | translate }}
          <details>
            <summary>{{ 'scanexam.templatemetadatadetails' | translate: { count: metadataProblems().length } }}</summary>
            <ul>
              @for (p of metadataProblems(); track $index) {
                <li>{{ p }}</li>
              }
            </ul>
          </details>
        </div>
      }
      <ngx-extended-pdf-viewer
        [src]="content"
        style="flex: 1 1 90%"
        #viewer
        [height]="'89vh'"
        [page]="1"
        [handTool]="false"
        [showHandToolButton]="false"
        [textLayer]="false"
        [(scrollMode)]="scrollMode"
        [handTool]="false"
        [showToolbar]="false"
        [showSecondaryToolbarButton]="false"
        [sidebarVisible]="false"
        (pageRender)="pageRender()"
        (pageRendered)="pageRendered($event)"
        backgroundColor="#ffffff"
        [zoom]="'page-width'"
        [minZoom]="0.5"
        [maxZoom]="3"
        (textLayerRendered)="foo($event)"
      ></ngx-extended-pdf-viewer>
    </div>
  }
</div>
